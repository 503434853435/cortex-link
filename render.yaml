services:
  - type: web
    runtime: static
    name: cortex-open
    buildCommand: "true"
    staticPublishPath: public
    previews:
      generation: "off"
    routes:
      - type: rewrite
        source: /o
        destination: /o.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
